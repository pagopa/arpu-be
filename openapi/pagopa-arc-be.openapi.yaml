openapi: 3.0.1
info:
  title: pagopa-arpu-be
  description: Api and Models
  version: 0.0.1
servers:
  - url: "http://localhost:8080"
    description: Generated server url
paths:
  /login/oneidentity:
    get:
      tags:
        - arc auth
      summary: "Provide the authentication endpoint"
      operationId: getAuthenticationEndpoint
      responses:
        '302':
          description: "Redirect to the authentication endpoint"
          headers:
            Location:
              description: >
                The URL to redirect to, including the following query parameters:
                - response_type: The type of response, e.g., "code".
                - scope: The scope of the access request, e.g., "openid profile email".
                - client_id: The client ID, e.g., "abc4hdRkqt3".
                - state: An opaque value used to maintain state between the request and callback, e.g., "abc4hdRkqt3".
                - redirect_uri: The URI to redirect to after authorization, e.g., "https://client.example.org/cb".
              schema:
                type: string
        '401':
          description: "Wrong or missing function key"
        '429':
          description: "Too many Requests"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /token/oneidentity:
    get:
      tags:
        - arc auth
      summary: "Provide authorization endpoint for exchanging code for token"
      operationId: getAuthenticationToken
      parameters:
        - name: code
          in: query
          description: "The value used for exchanging code for token"
          required: true
          schema:
            type: string
        - name: state
          in: query
          description: "The value of the state this value is handled by the security component"
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Token Response"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: "Wrong or missing function key"
        '429':
          description: "Too many Requests"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /logout:
    get:
      tags:
        - arc auth
      summary: "Provide the logout endpoint"
      operationId: getLogoutEndpoint
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: "User successfully logged out"
        '401':
          description: "Wrong or missing function key"
        '429':
          description: "Too many Requests"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /auth/user:
    get:
      tags:
        - arc auth
      summary: "Provide information regarding authenticated user"
      operationId: getUserInfo
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Token Response"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          description: "Request cannot be processed, required parameters are not present"
        '401':
          description: "Unauthorized"
        '429':
          description: "Too many Requests"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /auth/testuser:
    get:
      tags:
        - arc auth
      summary: "Provide access token for the sample user"
      operationId: getAuthTokenTestUser
      responses:
        '200':
          description: "Token Response"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '429':
          description: "Too many Requests"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /notices:
    get:
      tags:
        - arc notices
      summary: "Retrieve the paged notices list from arc"
      operationId: getNoticesList
      security:
        - BearerAuth: [ ]
      parameters:
        - name: x-continuation-token
          in: header
          description: "Continuation token"
          required: false
          schema:
            type: string
        - name: size
          in: query
          description: "Number of items for page"
          required: false
          schema:
            type: integer
            format: int32
            default: '10'
        - name: paidByMe
          in: query
          description: "The field to filter notices by if is payer"
          required: false
          schema:
            type: boolean
        - name: registeredToMe
          in: query
          description: "The field to filter notices by if is debtor"
          required: false
          schema:
            type: boolean
        - name: orderBy
          in: query
          description: "A value passed to sort by field (Default: TRANSACTION_DATE)"
          required: false
          schema:
            type: string
            enum: ["TRANSACTION_DATE"]
            default: "TRANSACTION_DATE"
        - name: ordering
          in: query
          description: "Direction of ordering (Default: DESC)"
          required: false
          schema:
            type: string
            enum: ["ASC", "DESC"]
            default: "DESC"
      responses:
        '200':
          description: "Obtained notices list"
          headers:
            x-continuation-token:
              schema:
                type: string
              description: "Continuation token"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticesListDTO'
        '400':
          description: "Invalid Request"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                error: invalid_amount
                error_description: "Invalid amount format"
        '401':
          description: "Wrong or missing function key"
        '429':
          description: "Too many Requests"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /notices/{eventId}:
    get:
      tags:
        - arc notices
      summary: "Retrieve notice details from arc"
      operationId: getNoticeDetails
      security:
        - BearerAuth: [ ]
      parameters:
        - name: eventId
          in: path
          description: "A unique id that identifies a paid notice"
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Obtained notice details"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeDetailsDTO'
        '400':
          description: "Invalid Request"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '401':
          description: "Wrong or missing function key"
        '404':
          description: "Notice details not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                error: "notice_not_found_error"
                error_description: "string"
        '429':
          description: "Too many Requests"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /notices/{eventId}/receipt:
    get:
      tags:
        - arc notices
      summary: "Retrieve notice receipt from arc"
      operationId: getNoticeReceipt
      security:
        - BearerAuth: [ ]
      parameters:
        - name: eventId
          in: path
          description: "A unique id that identifies a notice"
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Obtained PDF notice receipt"
          headers:
            Content-Disposition:
              description: >
                Header specifying whether the file should be online viewer only or downloaded. It also contains the file name.
              schema:
                type: string
                example: inline; filename="document.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: "Wrong or missing function key"
        '404':
          description: "Notice receipt not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                error: "receipt_not_found_error"
                error_description: "string"
        '429':
          description: "Too many Requests"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /payment-notices:
    post:
      tags:
        - arc payment notices
      summary: "Generate payment notice from arc"
      operationId: postGeneratePaymentNotice
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentNoticePayloadDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentNoticeDetailsDTO'
        '400':
          description: "Invalid Request"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                error: invalid_request
                error_description: "One or more inputs provided during the request are invalid"
        '401':
          description: "Wrong or missing function key"
        '429':
          description: "Too many Requests"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
    get:
      tags:
        - arc payment notices
      summary: "Retrieve payment notices from arc"
      operationId: getPaymentNotices
      security:
        - BearerAuth: [ ]
      parameters:
        - name: dueDate
          in: query
          description: Optional date to filter paymentNotices (if provided use the format yyyy-MM-dd)
          schema:
            format: date
            type: string
            example: '2022-03-10'
        - name: size
          in: query
          description: Number of elements on one page. Default = 50
          schema:
            format: int32
            default: 50
            maximum: 100
            minimum: 1
            type: integer
        - name: page
          in: query
          description: Page number. Page value starts from 0
          schema:
            format: int32
            default: 0
            minimum: 0
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentNoticesListDTO'
        '400':
          description: "Invalid Request"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                error: invalid_request
                error_description: "One or more inputs provided during the request from pull payment are invalid"
        '401':
          description: "Wrong or missing function key"
        '429':
          description: "Too many Requests"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /payment-notices/{iupd}:
    get:
      tags:
        - arc payment notices
      summary: "Retrieve payment notices details from arc"
      operationId: getPaymentNoticesDetails
      security:
        - BearerAuth: [ ]
      parameters:
        - name: iupd
          in: path
          description: "A unique iupd that identifies a payment notice"
          required: true
          schema:
            type: string
        - name: paTaxCode
          in: query
          description: "Fiscal code of EC"
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentNoticeDetailsDTO'
        '400':
          description: "Invalid Request"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                error: invalid_request
                error_description: "One or more inputs provided during the request from GPD are invalid"
        '401':
          description: "Wrong or missing function key"
        '404':
          description: "Payment notice not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              example:
                error: payment_notice_not_found_error
        '429':
          description: "Too many Requests"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /organizations:
    get:
      tags:
        - arc payment notice spontaneous
      summary: "Retrieve organizations list"
      operationId: getOrganizations
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: "Obtained organizations list"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationsListDTO'
        '401':
          description: "Wrong or missing function key"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /token/assistance:
    get:
      tags:
        - arc zendesk assistance
      summary: "Retrieve jwt token for the zendesk assistance"
      operationId: getZendeskAssistanceToken
      security:
        - BearerAuth: [ ]
      parameters:
        - name: userEmail
          in: query
          description: Required user mail for the assistance
          required: true
          schema:
            type: string
            format: email
            example: "someone@example.com"
      responses:
        '200':
          description: "Obtained token for zendesk assistance"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZendeskAssistanceTokenResponse'
        '400':
          description: "Invalid Request"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '401':
          description: "Wrong or missing function key"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /brokers/{brokerId}/organizations/spontaneous:
    get:
      tags:
        - Organization
      summary: "Retrieves the list of organizations with at least one dpto with flagSpontaneous and flagActive set to true"
      operationId: getOrganizationsWithSpontaneous
      security:
        - BearerAuth: [ ]
      parameters:
        - name: brokerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: "OrganizationsWithSpontaneousDTO"
        '401':
          description: Unauthorized - Missing or invalid token
        '403':
          description: Forbidden - Access denied
        '500':
          description: Internal Server Error
  /spontaneous/organizations/{organizationId}/debt-position-type-orgs:
    get:
      tags:
        - DebtPositionTypeOrg
      summary: "Retrieves the list of debtPositionTypeOrg with flagSpontaneous and flagActive set to true"
      operationId: getDebtPositionTypeOrgsWithSpontaneous
      security:
        - BearerAuth: [ ]
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: "DebtPositionTypeOrgsWithSpontaneousDTO"
        '401':
          description: Unauthorized - Missing or invalid token
        '403':
          description: Forbidden - Access denied
        '500':
          description: Internal Server Error
  /brokers/{brokerId}/debt-positions/{debtPositionId}/notice/zip:
    get:
      tags:
        - DebtPosition
      summary: "Retrieve and generate a ZIP file containing the payment notices of a specific DebtPosition"
      operationId: getUnpaidPaymentNoticeZip
      parameters:
        - name: brokerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: X-fiscal-code
          in: header
          required: false
          schema:
            type: string
        - name: debtPositionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: ZIP file containing the payment notices
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '204':
          description: No Content - No installments found
        '401':
          description: Unauthorized - Missing or invalid token
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          default: Bearer
        expiresIn:
          type: integer
        refreshToken:
          type: string
        idToken:
          type: string
    UserInfo:
      type: object
      required:
        - userId
        - fiscalCode
      properties:
        userId:
          type: string
        fiscalCode:
          type: string
        familyName:
          type: string
        name:
          type: string
        email:
          type: string
    ZendeskAssistanceTokenResponse:
      type: object
      required:
        - assistanceToken
        - returnTo
        - actionUrl
      properties:
        assistanceToken:
          type: string
        returnTo:
          type: string
          description: URL of the Help Center to return
        actionUrl:
          type: string
          description: URL of Zendesk endpoint
    NoticesListDTO:
      type: object
      properties:
        notices:
          type: array
          items:
            $ref: '#/components/schemas/NoticeDTO'
    NoticeDTO:
      type: object
      required:
        - eventId
        - payeeTaxCode
        - amount
        - noticeDate
        - isCart
        - paidByMe
        - registeredToMe
      properties:
        eventId:
          type: string
        payeeName:
          type: string
        payeeTaxCode:
          type: string
        amount:
          type: integer
          format: int64
        noticeDate:
          type: string
          format: zoned-date-time
          example: "2024-05-31T13:07:25Z"
        isCart:
          type: boolean
        paidByMe:
          type: boolean
        registeredToMe:
          type: boolean
    CartItemDTO:
      required:
        - subject
        - amount
        - refNumberValue
        - refNumberType
      type: object
      properties:
        subject:
          type: string
        amount:
          type: integer
          format: int64
        payee:
          $ref: "#/components/schemas/UserDetailDTO"
        debtor:
          $ref: "#/components/schemas/UserDetailDTO"
        refNumberValue:
          type: string
        refNumberType:
          type: string
    UserDetailDTO:
      required:
        - taxCode
      type: object
      properties:
        name:
          type: string
        taxCode:
          type: string
    WalletInfoDTO:
      type: object
      properties:
        accountHolder:
          type: string
        brand:
          type: string
          enum:
            - MASTERCARD
            - VISA
            - AMEX
            - MAESTRO
            - JCB
            - OTHER
            - DINERS
            - DISCOVER
            - UNIONPAY
        blurredNumber:
          type: string
        maskedEmail:
          type: string
    NoticeDetailsDTO:
      type: object
      properties:
        infoNotice:
          $ref: "#/components/schemas/InfoNoticeDTO"
        carts:
          type: array
          items:
            $ref: "#/components/schemas/CartItemDTO"
    InfoNoticeDTO:
      required:
        - eventId
        - rrn
        - noticeDate
        - pspName
        - amount
        - totalAmount
        - origin
      type: object
      properties:
        eventId:
          type: string
        authCode:
          type: string
        rrn:
          type: string
        noticeDate:
          type: string
          format: zoned-date-time
          example: "2024-05-31T13:07:25Z"
        pspName:
          type: string
        walletInfo:
          $ref: "#/components/schemas/WalletInfoDTO"
        paymentMethod:
          type: string
          enum:
            - BBT
            - BP
            - AD
            - CP
            - PO
            - OBEP
            - JIF
            - MYBK
            - PPAL
            - UNKNOWN
        payer:
          $ref: "#/components/schemas/UserDetailDTO"
        amount:
          type: integer
          format: int64
        fee:
          type: integer
          format: int64
        totalAmount:
          type: integer
          format: int64
        origin:
          type: string
          enum:
            - INTERNAL
            - PM
            - NDP001PROD
            - NDP002PROD
            - NDP003PROD
            - UNKNOWN
    PaymentNoticePayloadDTO:
      required:
        - paTaxCode
        - paFullName
        - amount
        - description
      type: object
      properties:
        paTaxCode:
          type: string
          description: "The fiscal code of EC"
          x-field-extra-annotation: "@jakarta.validation.constraints.NotBlank(message = \"paTaxCode is required\")"
        paFullName:
          type: string
          description: "The name of EC"
          x-field-extra-annotation: "@jakarta.validation.constraints.NotBlank(message = \"paFullName is required\")"
        amount:
          type: integer
          format: int64
          x-field-extra-annotation: "@jakarta.validation.constraints.NotNull(message = \"amount is required\")"
        description:
          type: string
          maxLength: 140
          minLength: 0
          x-field-extra-annotation: "@jakarta.validation.constraints.NotBlank(message = \"description is required\")"
    PaymentNoticesListDTO:
      type: object
      properties:
        paymentNotices:
          type: array
          items:
            $ref: '#/components/schemas/PaymentNoticeDTO'
    PaymentNoticeDTO:
      required:
        - iupd
        - paTaxCode
        - paFullName
        - status
        - paymentOptions
      type: object
      properties:
        iupd:
          description: Unique ID of the Debt Position (for positions originating from ACA the IUPD starts with ACA_)
          type: string
        paTaxCode:
          description: Tax code of the Creditor Body
          type: string
        paFullName:
          description: Company name of the Creditor Body
          type: string
        status:
          $ref: '#/components/schemas/PaymentNoticeStatus'
        paymentOptions:
          description: Array structure containing any payment options (there always exists at least 1)
          type: array
          items:
            $ref: '#/components/schemas/PaymentOptionDTO'
    ZonedDateTime:
      type: string
      format: zoned-date-time
      example: "2024-05-31T13:07:25Z"
    PaymentNoticeStatus:
      enum:
        - VALID
        - PARTIALLY_PAID
      type: string
    PaymentOptionDTO:
      required:
        - numberOfInstallments
        - installments
      type: object
      properties:
        description:
          description: Description of the payment option
          type: string
        numberOfInstallments:
          format: int32
          description: Number of installments that make up the payment option, if equal to 1 it is a single payment
          type: integer
        amount:
          format: int64
          description: total amount for the payment option
          type: integer
        dueDate:
          $ref: '#/components/schemas/ZonedDateTime'
        isPartialPayment:
          description: Indicates whether the OP is part of an installment plan
          type: boolean
        installments:
          description: Array structure containing the installments that make up the payment option (there always exists at least 1)
          type: array
          items:
            $ref: '#/components/schemas/InstallmentDTO'
    InstallmentDTO:
      required:
        - nav
        - iuv
        - paTaxCode
        - paFullName
        - amount
        - description
        - dueDate
        - status
      type: object
      properties:
        nav:
          description: Notice Code
          type: string
        iuv:
          description: Unique identifier
          type: string
        paTaxCode:
          description: Tax code of the Creditor Body
          type: string
        paFullName:
          description: Company name of the Creditor Body
          type: string
        amount:
          format: int64
          description: Payment Option Amount
          type: integer
        description:
          description: Description of the OP (e.g. "SISA - 741T, 942T - Checks without authorization or funding")
          type: string
        dueDate:
          $ref: '#/components/schemas/ZonedDateTime'
        status:
          $ref: '#/components/schemas/PaymentOptionStatus'
    PaymentOptionStatus:
      enum:
        - PO_UNPAID
        - PO_PAID
        - PO_PARTIALLY_REPORTED
        - PO_REPORTED
      type: string
    PaymentNoticeDetailsDTO:
      type: object
      properties:
        iupd:
          description: Unique ID of the Debt Position (for positions originating from ACA the IUPD starts with ACA_)
          type: string
        paTaxCode:
          description: Tax code of the Creditor Body
          type: string
        paFullName:
          description: Company name of the Creditor Body
          type: string
        status:
          $ref: '#/components/schemas/PaymentNoticeDetailsStatus'
        paymentOptions:
          description: Array structure containing any payment options (there always exists at least 1)
          type: array
          items:
            $ref: '#/components/schemas/PaymentOptionDetailsDTO'
    PaymentNoticeDetailsStatus:
      enum:
        - DRAFT
        - PUBLISHED
        - VALID
        - INVALID
        - EXPIRED
        - PARTIALLY_PAID
        - PAID
        - REPORTED
      type: string
    PaymentOptionDetailsDTO:
      type: object
      properties:
        nav:
          description: Notice Code
          type: string
        iuv:
          description: Unique identifier
          type: string
        amount:
          format: int64
          description: Payment Option Amount
          type: integer
        description:
          description: Description of the OP (e.g. "SISA - 741T, 942T - Checks without authorization or funding")
          type: string
        isPartialPayment:
          description: Indicates, if set to true, the current PO is a installment
          type: boolean
        dueDate:
          $ref: '#/components/schemas/ZonedDateTime'
        notificationFee:
          format: int64
          description: corresponds to the SEND notification costs
          type: integer
        status:
          $ref: '#/components/schemas/PaymentOptionStatus'
    OrganizationsListDTO:
      type: object
      properties:
        organizations:
          description: Array structure containing the organizations
          type: array
          items:
            $ref: '#/components/schemas/OrganizationDTO'
    OrganizationDTO:
      type: object
      required:
        - id
        - paFullName
        - paTaxCode
        - ipaCode
      properties:
        id:
          type: string
        paFullName:
          type: string
        paTaxCode:
          type: string
        ipaCode:
          type: string
    ErrorDTO:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - generic_error
            - receipt_not_found_error
            - notice_not_found_error
            - payment_notice_not_found_error
            - invalid_amount
            - invalid_date
            - invalid_email
            - invalid_request
            - auth_user_unauthorized
            - too_many_request
            - bad_request
        error_description:
          type: string
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonProperty(\"error_description\")"