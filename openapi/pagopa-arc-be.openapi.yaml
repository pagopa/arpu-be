components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          default: Bearer
        expiresIn:
          type: integer
        refreshToken:
          type: string
        idToken:
          type: string
    UserInfo:
      type: object
      required:
        - userId
        - fiscalCode
      properties:
        userId:
          type: string
        fiscalCode:
          type: string
        familyName:
          type: string
        name:
          type: string
        email:
          type: string
    ZendeskAssistanceTokenResponse:
      type: object
      required:
        - assistanceToken
        - returnTo
        - actionUrl
      properties:
        assistanceToken:
          type: string
        returnTo:
          type: string
          description: URL of the Help Center to return
        actionUrl:
          type: string
    ZonedDateTime:
      type: string
      format: zoned-date-time
      example: "2024-05-31T13:07:25Z"
    OrganizationsListDTO:
      type: object
      properties:
        organizations:
          description: Array structure containing the organizations
          type: array
          items:
            $ref: '#/components/schemas/OrganizationDTO'
    OrganizationDTO:
      type: object
      required:
        - id
        - paFullName
        - paTaxCode
        - ipaCode
      properties:
        id:
          type: string
        paFullName:
          type: string
        paTaxCode:
          type: string
        ipaCode:
          type: string
    ErrorDTO:
      type: object
      required:
        - category
        - message
      properties:
        category:
          type: string
          description: The title describing the error
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - GENERIC_ERROR
            - FORBIDDEN
            - CONFLICT
            - TOO_MANY_REQUEST
            - UNAUTHORIZED
        message:
          type: string
          description: Description of the error
        traceId:
          type: string
        code:
          type: string