server:
  http: "\${SERVER_PORT:8080}"

spring:
  application:
    name: ${artifactId}
    version: ${version}
  jmx.enabled: true
  threads:
    virtual:
      enabled: "\${VIRTUAL_THREADS_ENABLED:true}"
  cache:
    type: redis
  data:
    redis:
      host: "\${REDIS_HOST:}"
      port: "\${REDIS_PORT:}"
      password: "\${REDIS_PASSWORD:}"
      ssl.enabled: "\${REDIS_SSL_ENABLED:false}"
  security:
    oauth2:
      client:
        registration:
          oneidentity:
            provider: oneidentity
            client-id: "\${AUTH_CLIENT_ID:}"
            client-secret: "\${AUTH_CLIENT_SECRET:}"
            authorization-grant-type: authorization_code
            redirect-uri: "\${AUTH_CLIENT_REDIRECT_URI:}"
            scope: openid
        provider:
          oneidentity:
            issuer-uri: "\${AUTH_ISSUER_URI:}"
            authorization-uri: "\${AUTH_CLIENT_AUTHORIZATION_URI:}"
            token-uri: "\${AUTH_CLIENT_TOKEN_URI:}"
            user-name-attribute: sub
            jwk-set-uri: "\${AUTH_CLIENT_JWK_URI:}"
white-list-cf-users: "\${WHITE_LIST_USERS:}"

jwt:
  audience: "\${JWT_TOKEN_AUDIENCE:application-audience}"
  tokenType: "\${JWT_TOKEN_TYPE:Bearer}"
  access-token:
    expire-in: "\${JWT_TOKEN_EXPIRATION_SECONDS:3600}"
    private-key: "\${JWT_TOKEN_PRIVATE_KEY:}"
    public-key: "\${JWT_TOKEN_PUBLIC_KEY:}"

zendesk-assistance:
  tokenType: JWT
  return-to: "\${HELP_CENTER_URL:}"
  action-url: "\${ZENDESK_ACTION_URL:}"
  assistance-token:
    product-id: "\${ASSISTANCE_ZENDESK_PRODUCT_ID:}"
    organization: "\${ASSISTANCE_ZENDESK_ORGANIZATION:}"
    private-key: "\${JWT_TOKEN_ASSISTANCE_ZENDESK_PRIVATE_KEY:}"

rest-client:
  defaults:
    connection-pool:
      size: "\${DEFAULT_REST_CONNECTION_POOL_SIZE:10}"
      size-per-route: "\${DEFAULT_REST_CONNECTION_POOL_SIZE_PER_ROUTE:5}"
      time-to-live-minutes: "\${DEFAULT_REST_CONNECTION_POOL_TIME_TO_LIVE_MINUTES:10}"
    timeout:
      connect-millis: "\${DEFAULT_REST_TIMEOUT_CONNECT_MILLIS:120000}"
      read-millis: "\${DEFAULT_REST_TIMEOUT_READ_MILLIS:120000}"
  auth:
    base-url: "\${P4PA_AUTH_SERVER_BASE_URL:}/payhub"
    max-attempts: "\${P4PA_AUTH_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${P4PA_AUTH_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${P4PA_AUTH_PRINT_BODY_WHEN_ERROR:true}"
    post-token:
      client_secret: "\${P4PA_AUTH_CLIENT_SECRET:clientsecret}"
  citizen:
    base-url: "\${P4PA_CITIZEN_SERVER_BASE_URL:}"
    max-attempts: "\${P4PA_CITIZEN_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${P4PA_CITIZEN_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${P4PA_CITIZEN_PRINT_BODY_WHEN_ERROR:true}"
  google-recaptcha:
    base-url: "\${GOOGLE_RECAPTCHA_SERVER_BASE_URL:}"
    max-attempts: "\${GOOGLE_RECAPTCHA_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${GOOGLE_RECAPTCHA_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${GOOGLE_RECAPTCHA_PRINT_BODY_WHEN_ERROR:true}"
    recaptcha:
      secret: "\${GOOGLE_RECAPTCHA_SECRET:}"

springdoc:
  writer-with-default-pretty-printer: true

google-recaptcha:
  enabled: "\${GOOGLE_RECAPTCHA_ENABLED:false}"
  protected-paths: "\${GOOGLE_RECAPTCHA_PROTECTED_PATHS:
    /public/brokers/*/spontaneous/debt-positions,
    /public/brokers/*/organizations/*/debt-positions/notice}"

management:
  info:
    build.enabled: true
    java.enabled: true
    git.enabled: true
  otlp.metrics.export.enabled: "\${TRACING_EXPORT:false}"
  tracing:
    sampling.probability: "\${TRACING_SAMPLING_PROBABILITY:1.0}"
  observations:
    http.server:
      filter.order: -100
  endpoints:
    jmx:
      exposure.include: "*"
    web:
      exposure:
        include: health, info, prometheus, metrics
      base-path: /actuator
  endpoint:
    health:
      probes.enabled: true
      logging.slow-indicator-threshold: "\${HEALTH_ACTUATOR_LOGGER_TIMEOUT_DURATION:PT1S}"
      show-details: "\${HEALTH_ACTUATOR_SHOW_DETAILS:when-authorized}"
      group:
        readiness.include: "*"
        liveness.include: livenessState,diskSpace,ping
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${artifactId}
    export:
      prometheus:
        enabled: true
        step: 1m
        descriptions: true
    enable:
      jvm: true
      process: true
      system: true
      http: true
      logback: true

logging:
  level:
    root: "\${LOG_LEVEL_ROOT:INFO}"
    it.gov.pagopa: "\${LOG_LEVEL_PAGOPA:INFO}"
    org.springframework: "\${LOG_LEVEL_SPRING:INFO}"
    org.springframework.boot.availability: "\${LOG_LEVEL_SPRING_BOOT_AVAILABILITY:DEBUG}"
    it.gov.pagopa.arc.exception.ControllerExceptionHandler: "\${LOGGING_LEVEL_API_REQUEST_EXCEPTION:INFO}"
    it.gov.pagopa.arc.connector: "\${LOGGING_LEVEL_ARC_CONNECTOR:INFO}"
    org.springdoc.core.utils.SpringDocAnnotationsUtils: "\${LOG_LEVEL_SPRING_DOC:ERROR}"
    PERFORMANCE_LOG: "\${LOG_LEVEL_PERFORMANCE_LOG:INFO}"
    PERFORMANCE_LOG.API_REQUEST: "\${LOG_LEVEL_PERFORMANCE_LOG_API_REQUEST:\${logging.level.PERFORMANCE_LOG}}"
    PERFORMANCE_LOG.REST_INVOKE: "\${LOG_LEVEL_PERFORMANCE_LOG_REST_INVOKE:\${logging.level.PERFORMANCE_LOG}}"